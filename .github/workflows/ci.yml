name: CI - Test, Build and Health Baseline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  id-token: write

jobs:
  ci:
    name: Unit Test + Security + Docker Build + Health Check
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Scan repository for secrets
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        working-directory: app
        run: pip install -r requirements-dev.txt

      - name: Run unit tests
        working-directory: app
        env:
          MADAR_DB_PASSWORD: dummy-test-only
          PYTHONPATH: .
        run: python -m pytest -q

      - name: Audit Python dependencies
        working-directory: app
        run: python -m pip_audit -r requirements.txt

      - name: Build application image
        run: docker build -t madar-phase06-ci:${{ github.sha }} ./app

      - name: Scan container image for vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: madar-phase06-ci:${{ github.sha }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL

      - name: Start application container
        run: |
          docker run -d \
            --name madar-p06-ci \
            -p 8080:8080 \
            -e MADAR_DB_PASSWORD=dummy-ci-only \
            madar-phase06-ci:${{ github.sha }}

      - name: Wait for application health
        shell: bash
        run: |
          for attempt in {1..15}; do
            if curl --fail --silent http://localhost:8080/api/health > /tmp/health.json; then
              cat /tmp/health.json
              exit 0
            fi
            sleep 2
          done
          echo "Application did not become healthy in time."
          docker logs madar-p06-ci || true
          exit 1

      - name: Configure AWS credentials via GitHub OIDC
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::197821101770:role/MADAR-Phase06-GitHubActionsRole
          aws-region: us-east-1

      - name: Login to Amazon ECR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Publish immutable image to ECR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: madar-phase06
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker tag madar-phase06-ci:${IMAGE_TAG} ${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}
          docker push ${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}

      - name: Register new ECS task definition revision
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: task-def
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        shell: bash
        run: |
          aws ecs describe-task-definition \
            --task-definition madar-p06-app \
            --query taskDefinition \
            --output json > /tmp/current-task-definition.json

          jq --arg IMAGE "${ECR_REGISTRY}/madar-phase06:${IMAGE_TAG}" '
            del(.taskDefinitionArn,.revision,.status,.requiresAttributes,.compatibilities,.registeredAt,.registeredBy)
            | .containerDefinitions[0].image = $IMAGE
          ' /tmp/current-task-definition.json > /tmp/new-task-definition.json

          TASK_DEF_ARN=$(aws ecs register-task-definition \
            --cli-input-json file:///tmp/new-task-definition.json \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)

          echo "task_definition_arn=${TASK_DEF_ARN}" >> "$GITHUB_OUTPUT"
          echo "Registered ${TASK_DEF_ARN}"

      - name: Deploy task definition to ECS service
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          TASK_DEF_ARN: ${{ steps.task-def.outputs.task_definition_arn }}
        run: |
          aws ecs update-service \
            --cluster madar-p06-cluster \
            --service madar-p06-service \
            --task-definition "${TASK_DEF_ARN}" \
            --query 'service.{Service:serviceName,TaskDefinition:taskDefinition,Desired:desiredCount}' \
            --output table

          aws ecs wait services-stable \
            --cluster madar-p06-cluster \
            --services madar-p06-service

      - name: Validate deployed health and database readiness
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          BASE_URL: http://madar-p06-alb-1308264135.us-east-1.elb.amazonaws.com
        run: |
          echo "Validating ${BASE_URL}/api/health"
          curl --fail --show-error --silent "${BASE_URL}/api/health" | tee /tmp/deployed-health.json
          echo
          echo "Validating ${BASE_URL}/api/ready"
          curl --fail --show-error --silent "${BASE_URL}/api/ready" | tee /tmp/deployed-ready.json
          echo
          echo "Deployment validation passed."

      - name: Clean up test container
        if: always()
        shell: bash
        run: |
          if docker container inspect madar-p06-ci >/dev/null 2>&1; then
            docker rm -f madar-p06-ci
          fi

      - name: Show container logs on failure
        if: failure()
        shell: bash
        run: |
          if docker container inspect madar-p06-ci >/dev/null 2>&1; then
            docker logs madar-p06-ci
          else
            echo "Container was not created; no container logs are available."
          fi
