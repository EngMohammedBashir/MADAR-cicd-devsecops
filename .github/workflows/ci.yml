name: CI - Test, Build and Health Baseline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    name: Unit Test + Security + Docker Build + Health Check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Scan repository for secrets
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        working-directory: app
        run: pip install -r requirements-dev.txt

      - name: Run unit tests
        working-directory: app
        env:
          MADAR_DB_PASSWORD: dummy-test-only
          PYTHONPATH: .
        run: python -m pytest -q

      - name: Audit Python dependencies
        working-directory: app
        run: python -m pip_audit -r requirements.txt

      - name: Build application image
        run: docker build -t madar-phase06-ci:${{ github.sha }} ./app

      - name: Start application container
        run: |
          docker run -d \
            --name madar-p06-ci \
            -p 8080:8080 \
            -e MADAR_DB_PASSWORD=dummy-ci-only \
            madar-phase06-ci:${{ github.sha }}

      - name: Wait for application health
        shell: bash
        run: |
          for attempt in {1..15}; do
            if curl --fail --silent http://localhost:8080/api/health > /tmp/health.json; then
              cat /tmp/health.json
              exit 0
            fi
            sleep 2
          done
          echo "Application did not become healthy in time."
          docker logs madar-p06-ci || true
          exit 1

      - name: Show container logs on failure
        if: failure()
        shell: bash
        run: |
          if docker container inspect madar-p06-ci >/dev/null 2>&1; then
            docker logs madar-p06-ci
          else
            echo "Container was not created; no container logs are available."
          fi

      - name: Clean up test container
        if: always()
        shell: bash
        run: |
          if docker container inspect madar-p06-ci >/dev/null 2>&1; then
            docker rm -f madar-p06-ci
          fi
