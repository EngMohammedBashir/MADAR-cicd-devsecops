name: CI - Build and Health Baseline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  docker-baseline:
    name: Docker Build + Health Check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build application image
        run: docker build -t madar-phase06-ci:${{ github.sha }} ./app

      - name: Start application container
        run: |
          docker run -d \
            --name madar-p06-ci \
            -p 8080:8080 \
            -e MADAR_DB_PASSWORD=dummy-ci-only \
            madar-phase06-ci:${{ github.sha }}

      - name: Wait for application health
        shell: bash
        run: |
          for attempt in {1..15}; do
            if curl --fail --silent http://localhost:8080/api/health > /tmp/health.json; then
              cat /tmp/health.json
              exit 0
            fi
            sleep 2
          done
          echo "Application did not become healthy in time."
          docker logs madar-p06-ci || true
          exit 1

      - name: Show container logs on failure
        if: failure()
        run: docker logs madar-p06-ci || true

      - name: Clean up test container
        if: always()
        run: docker rm -f madar-p06-ci || true
